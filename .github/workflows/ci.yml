name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  # Use one concurrency group per PR so a newer commit cancels an older run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      # Build-time placeholders only. CI does not connect to Supabase or Razorpay.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci-placeholder
      RAZORPAY_WEBHOOK_SECRET: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Apply the complete migration history to a fresh database
        run: npx supabase db reset --local

      - name: Verify database permissions and security contracts
        run: npx supabase test db --local

      - name: Run ESLint
        run: npm run lint

      - name: Run backend unit tests
        run: npm run test:backend

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
